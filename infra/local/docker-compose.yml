name: pet-platform-local

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请设置本地数据库名称}
      POSTGRES_USER: ${POSTGRES_USER:?请设置本地数据库用户}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置本地专用数据库密码}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.2.10-bookworm@sha256:47670742d7924adbcdb404d1288b6327815b23141969c0939b8e5d61f78c2634
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置本地专用 Redis 密码}
    # 密码由容器环境写入私有配置，避免作为 redis-server 进程参数。
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf '%s\n' 'bind 0.0.0.0' 'protected-mode yes' 'appendonly yes' 'dir /data' > /tmp/redis-local.conf
        printf 'requirepass "%s"\n' "$$(printf '%s' "$$REDIS_PASSWORD" | sed 's/\\/\\\\/g; s/"/\\"/g')" >> /tmp/redis-local.conf
        exec /usr/local/bin/docker-entrypoint.sh redis-server /tmp/redis-local.conf
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.3.6-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
    # 节点数据目录依赖 hostname；容器重建后保持节点身份稳定。
    hostname: rabbitmq
    # 已有验证容器实际 StopTimeout=1 导致 SIGKILL；显式配置避免继承过短宽限期。
    stop_grace_period: 30s
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?请设置本地 RabbitMQ 用户}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?请设置本地专用 RabbitMQ 密码}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-15672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
