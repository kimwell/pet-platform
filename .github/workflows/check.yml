name: 工程基础检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # 官方 v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # 官方 v4
        with:
          version: 10.34.6
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # 官方 v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:typecheck
      - run: pnpm contracts:test
      - run: pnpm check
      - run: pnpm build:web
      # 配置校验只使用公开的技术夹具值，不启动容器，不代表集成测试。
      - name: 校验 Compose 配置
        run: pnpm check:infra --env-file infra/local/.env.example
        env:
          POSTGRES_DB: p02_configuration_fixture
          POSTGRES_USER: p02_configuration_fixture
          POSTGRES_PASSWORD: p02_configuration_fixture
          REDIS_PASSWORD: p02_configuration_fixture
          RABBITMQ_DEFAULT_USER: p02_configuration_fixture
          RABBITMQ_DEFAULT_PASS: p02_configuration_fixture
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # 官方 v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # 官方 v5.7.0
        with:
          distribution: temurin
          # Adoptium 的 SemVer 标识，对应矩阵中的 Temurin 运行版本。
          java-version: '21.0.12+101.0.LTS'
          cache: maven
          cache-dependency-path: apps/backend/pom.xml
      - name: 核验 JDK 运行版本
        run: |
          java -version
          runtime_version="$(java -XshowSettings:properties -version 2>&1 | awk '$1 == "java.runtime.version" { print $3 }')"
          if [ "$runtime_version" != '21.0.12.1+1-LTS' ]; then
            echo "JDK 运行版本与冻结基线不一致：$runtime_version" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # 官方 v4
        with:
          version: 10.34.6
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # 官方 v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 确认 PostgreSQL 集成测试所需 Docker 可用
        run: docker info --format '{{.ServerVersion}}'
      - name: 独立导出与生成产物一致性检查
        run: pnpm contracts:check
      - name: Maven Wrapper 校验与构建
        working-directory: apps/backend
        run: |
          ./mvnw --version
          ./mvnw --batch-mode clean verify
